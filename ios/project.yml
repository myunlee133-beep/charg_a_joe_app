name: Chajajwo
options:
  bundleIdPrefix: org.chargajoe
  deploymentTarget:
    iOS: "17.0"
packages:
  KakaoMapsSDK:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM.git
    from: 2.9.4
targets:
  Chajajwo:
    type: application
    platform: iOS
    sources: [Chajajwo]
    dependencies:
      - package: KakaoMapsSDK
        product: KakaoMapsSDK-SPM
    info:
      path: Chajajwo/Info.plist
      properties:
        CFBundleDisplayName: 찾아줘
        KAKAO_APP_KEY: "633176f4920468978f1c055f77f9ef5f"  # 카카오 개발자 콘솔의 네이티브 앱 키를 여기에 입력
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: 지도에서 내 위치 주변의 분실물 보관 거점을 보여주기 위해 위치를 사용해요.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.chargajoe.chajajwo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
