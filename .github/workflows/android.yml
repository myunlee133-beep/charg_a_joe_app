name: Android
on:
  push:
    branches: ['android-port', 'android/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chajajwo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Chajajwo-android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch screens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/tools/preview.sh apk/app-debug.apk "$RUNNER_TEMP/android-preview"
      - name: Print preview summary and screenshots
        if: always()
        run: |
          OUT="$RUNNER_TEMP/android-preview"
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
          echo "::group::summary"; cat "$OUT/summary.txt" || true; echo "::endgroup::"
          for f in "$OUT"/*.png; do
            n=$(basename "$f" .png)
            python3 -c "from PIL import Image; im=Image.open('$f').convert('RGB'); im=im.resize((im.width*2//5, im.height*2//5)); im.save('$OUT/$n.jpg', quality=72)" || cp "$f" "$OUT/$n.jpg"
            echo "=====BEGIN $n====="; base64 -w 8000 "$OUT/$n.jpg"; echo "=====END $n====="
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-preview
          path: ${{ runner.temp }}/android-preview
